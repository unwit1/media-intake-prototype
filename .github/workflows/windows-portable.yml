name: Windows portable executable

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build one-file GUI executable
        shell: pwsh
        run: .\tools\build-portable.ps1 -Clean
      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: MediaIntake-windows-portable
          path: dist/MediaIntake.exe
