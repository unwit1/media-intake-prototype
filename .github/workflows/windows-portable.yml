name: Windows portable executable

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build one-file GUI executable
        shell: pwsh
        run: .\tools\build-portable.ps1 -Clean
      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: MediaIntake-windows-portable
          path: dist/MediaIntake.exe
      - name: Publish latest portable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: portable-latest
          name: Media Intake portable app (latest)
          body: Automatically built from the latest commit on main.
          files: dist/MediaIntake.exe
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
